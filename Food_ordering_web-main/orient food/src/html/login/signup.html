<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Orient College Cafe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9e3e3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .signup-container {
            background-color: #c2bdbd;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #ff0505;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #f01616;
            border-radius: 4px;
            font-size: 16px;
        }

        .btn {
            background-color: #fa0606;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #ff0101;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: #fa0000;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="signup-container">
    <h1>Sign Up - Orient College Cafe</h1>
    <form onsubmit="signup(event)">
        <div class="input-group">
            <label for="new-username">Username</label>
            <input type="text" id="new-username" name="username" placeholder="Create your username" required>
        </div>
        <div class="input-group">
            <label for="new-password">Password</label>
            <input type="password" id="new-password" name="password" placeholder="Create your password" required>
        </div>
        <div class="input-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
        </div>
        <button type="submit" class="btn">Sign Up</button>
    </form>

    <div class="link">
        <p>Already have an account? <a href="/orient food/src/html/login/login.html">Login here</a></p>
    </div>
</div>

<script>
    // Sign-up function to handle multiple users
    function signup(event) {
        event.preventDefault(); // Prevent form from submitting normally

        const username = document.getElementById('new-username').value;
        const password = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        // Password confirmation check
        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        // Retrieve existing users from localStorage
        let users = JSON.parse(localStorage.getItem('users')) || [];

        // Check if the username already exists
        const userExists = users.some(user => user.username === username);
        if (userExists) {
            alert("Username already exists! Please choose a different username.");
            return;
        }

        // Create a new user object
        const newUser = {
            username: username,
            password: password
        };

        // Add the new user to the users array
        users.push(newUser);

        // Save the updated list of users to localStorage
        localStorage.setItem('users', JSON.stringify(users));

        // Redirect to login page
        alert("Sign up successful! You can now log in.");
        window.location.href = "login.html";
    }
</script>

</body>
</html>
