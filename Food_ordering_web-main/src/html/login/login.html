<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Orient College Cafe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #fd260a;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #f12424;
            border-radius: 4px;
            font-size: 16px;
        }

        .btn {
            background-color: #f8620a;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #f1140c;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: #fc1212;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>Login - Orient College Cafe</h1>
    <form onsubmit="login(event)">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>

    <div class="link">
        <p>Don't have an account? <a href="/src/html/login/signup.html">Sign up here</a></p>
    </div>
</div>

<script>
    // Login function to check user credentials
    function login(event) {
        event.preventDefault(); // Prevent form from submitting normally

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Retrieve the list of users from localStorage
        const users = JSON.parse(localStorage.getItem('users'));

        if (users) {
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                alert("Login successful!");
                // Redirect to the home page
                window.location.href = "/index.html";
            } else {
                alert("Invalid username or password!");
            }
        } else {
            alert("No users found! Please sign up first.");
        }
    }
</script>

</body>
</html>
